<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>修理料金計算 | メカニック計算ツール</title>
  <meta name="description" content="メカニック専用の自動車修理料金計算ツール。店内・出張修理、劣化パーツ、タイヤ、NOS補充などの修理費用をワンタップ計算。">
  <!-- Favicon & App Icons -->
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="icon" type="image/png" href="og-image.png">
  <link rel="apple-touch-icon" href="og-image.png">
  <!-- OGP / Social Meta Tags -->
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="MECHANIC CALCULATOR">
  <meta property="og:url" content="https://mechanic-calculator.web.app/repair.html">
  <meta property="og:title" content="修理料金計算 | メカニック計算ツール">
  <meta property="og:description" content="メカニック専用の自動車修理料金計算ツール。店内・出張修理、劣化パーツ、タイヤ、NOS補充などの修理費用をワンタップ計算。">
  <meta property="og:image" content="https://mechanic-calculator.web.app/og-image.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="修理料金計算 | メカニック計算ツール">
  <meta name="twitter:description" content="メカニック専用の自動車修理料金計算ツール。店内・出張修理、劣化パーツ、タイヤ、NOS補充などの修理費用をワンタップ計算。">
  <meta name="twitter:image" content="https://mechanic-calculator.web.app/og-image.png">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">
  <!-- Firebase Compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <div class="app-container">
    <!-- Header with Shop Brand & Hamburger Menu -->
    <header class="header">
      <div class="brand">
        <img src="logo.svg" alt="Mechanic Logo" class="brand-logo">
        <div class="brand-titles">
          <h1 class="brand-name">MECHANIC CALCULATOR</h1>
          <div class="brand-meta">
            <span class="brand-sub">修理計算モード</span>
            <div class="brand-shop-badge">
              <span>🏢</span>
              <span class="shop-name-display" id="currentShopName">読み込み中...</span>
            </div>
          </div>
        </div>
      </div>
      <div class="hamburger-menu-container">
        <button id="hamburgerBtn" class="hamburger-btn" aria-label="メニューを開く" aria-expanded="false">
          ☰
        </button>
        <div id="navMenuDropdown" class="menu-dropdown">
          <a href="#" id="menuCopyShopUrl" class="menu-item">
            <span class="menu-item-icon">🔗</span>
            <span>店舗URLを共有</span>
          </a>
          <a href="index.html" class="menu-item">
            <span class="menu-item-icon">🏠</span>
            <span>店舗切替</span>
          </a>
          <a href="settings.html" class="menu-item">
            <span class="menu-item-icon">⚙️</span>
            <span>設定</span>
          </a>
          <a href="#" id="menuFeedback" class="menu-item">
            <span class="menu-item-icon">💬</span>
            <span>不具合・ご要望</span>
          </a>
        </div>

      </div>
    </header>

    <!-- Sub Navigation Tabs (Header直下の右端揃え) -->
    <div class="sub-nav">
      <nav class="nav-tabs">
        <a href="repair.html" class="nav-tab active">🔧 修理</a>
        <a href="custom.html" class="nav-tab">🎨 カスタム</a>
        <a href="buyback.html" class="nav-tab">📦 買取</a>
      </nav>
    </div>

    <!-- Top Control Bar (Mode Switch & Global Actions) -->
    <section class="control-bar">
      <div class="mode-switch-container">
        <span class="mode-label">作業場所:</span>
        <div class="mode-toggle-group">
          <button id="btnModeShop" class="mode-btn active" data-mode="shop">
            <span class="icon">🏪</span> 店内
          </button>
          <button id="btnModeOnsite" class="mode-btn" data-mode="onsite">
            <span class="icon">🛻</span> 出張
          </button>
        </div>
      </div>

      <div class="option-check-group">
        <label class="checkbox-card" id="aircraftLabel">
          <input type="checkbox" id="chkAircraft">
          <span class="checkbox-custom"></span>
          <span class="label-text">✈️ 航空機・船 <small id="priceAircraft">(+¥100,000)</small></span>
        </label>
      </div>

      <button id="btnResetRepair" class="reset-btn" title="すべての選択を初期化">
        <span class="icon">🔄</span> 一括リセット
      </button>
    </section>

    <!-- Main Grid Content (Repair Page) -->
    <main class="main-grid" id="repairMainGrid">
      <!-- Section 1: 修理・基本作業 (左カラム) -->
      <div class="card category-card" id="cardBaseRepairs">
        <div class="card-header">
          <h2 class="card-title">🔧 修理・基本作業</h2>
          <span class="mode-indicator-tag" id="modeTag">店内料金適用中</span>
        </div>
        <div class="card-body" id="repairBaseContainer">
          <!-- JSで動的レンダリング -->
        </div>
      </div>

      <!-- Section 2: NOS ＆ 販売品 (右カラム) -->
      <div class="right-column-group">
        <!-- 追加サービス / NOS -->
        <div class="card category-card" id="cardExtraServices">
          <div class="card-header">
            <h2 class="card-title">🚀 NOS・追加サービス</h2>
          </div>
          <div class="card-body" id="repairExtraContainer">
            <!-- JSで動的レンダリング -->
          </div>
        </div>

        <!-- 販売品・アクセサリー -->
        <div class="card category-card" id="cardRepairItems">
          <div class="card-header">
            <h2 class="card-title">📦 販売品・アクセサリー</h2>
          </div>
          <div class="card-body" id="repairItemsContainer">
            <!-- JSで動的レンダリング -->
          </div>
        </div>
      </div>
    </main>

    <!-- Bottom Sticky Summary & Action Bar (Repair Page) -->
    <footer class="summary-bar">
      <div class="summary-inner">
        <!-- Display Totals with Inline Copy Button -->
        <div class="summary-amount-block">
          <div class="amounts-grid">
            <div class="amount-card-inline">
              <div class="amount-text-group">
                <span class="main-label">修理請求額</span>
                <span id="repairTotalDisplay" class="total-price">¥0</span>
              </div>
              <button id="btnCopyRepairTotal" class="btn-icon-only primary-copy" title="請求額の数値のみコピー">
                <span class="btn-icon">📋</span>
              </button>
            </div>
          </div>
        </div>

        <!-- Right Side Copy Action Buttons -->
        <div class="action-buttons-grid">
          <button id="btnCopyRepairSummary" class="btn-copy-sub" title="修理作業内容サマリをコピー">
            <span class="btn-icon">📄</span>
            <span class="btn-sub-text">内容サマリ</span>
          </button>
        </div>
      </div>
    </footer>

    <!-- Toast Notification -->
    <div id="toast" class="toast hidden">
      <span class="toast-icon">✅</span>
      <span id="toastMsg" class="toast-msg">コピーしました！</span>
    </div>
  </div>

  <script src="firebase-config.js"></script>
  <script src="calculator-core.js"></script>
  <script src="common.js"></script>
  <script src="app.js"></script>
</body>
</html>
