<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新規店舗開設 | メカニック計算ツール</title>
  <meta name="description" content="新規メカニック店舗の開設。店舗名・店舗ID・管理パスコードを設定し、チームで共有可能な独自価格表を作成。">
  <!-- Favicon & App Icons -->
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="icon" type="image/png" href="og-image.png">
  <link rel="apple-touch-icon" href="og-image.png">
  <!-- OGP / Social Meta Tags -->
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="MECHANIC CALCULATOR">
  <meta property="og:url" content="https://mechanic-calculator.web.app/register.html">
  <meta property="og:title" content="新規店舗開設 | メカニック計算ツール">
  <meta property="og:description" content="新規メカニック店舗の開設。店舗名・店舗ID・管理パスコードを設定し、チームで共有可能な独自価格表を作成。">
  <meta property="og:image" content="https://mechanic-calculator.web.app/og-image.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="新規店舗開設 | メカニック計算ツール">
  <meta name="twitter:description" content="新規メカニック店舗の開設。店舗名・店舗ID・管理パスコードを設定し、チームで共有可能な独自価格表を作成。">
  <meta name="twitter:image" content="https://mechanic-calculator.web.app/og-image.png">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">
  
  <!-- Firebase Compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <div class="app-container" style="max-width: 600px; padding-top: 40px;">
    <header class="header" style="justify-content: center; text-align: center; flex-direction: column; gap: 12px;">
      <div class="brand">
        <img src="logo.svg" alt="Mechanic Logo" class="brand-logo">
        <div class="brand-titles">
          <h1 class="brand-name">MECHANIC CALCULATOR</h1>
          <span class="brand-sub">新規メカニック（店舗）開設</span>
        </div>
      </div>
    </header>

    <main class="card" style="padding: 32px; margin-top: 20px;">
      <h2 style="font-size: 1.3rem; font-weight: 800; margin-bottom: 8px;">➕ 新規メカニック登録</h2>
      <p style="font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 24px;">
        新しいメカニック店舗用の計算機を作成します。登録完了後、専用のアクセスURLが発行されます。
      </p>

      <!-- Google Owner Authentication Section -->
      <div id="ownerAuthSection" style="margin-bottom: 24px; padding: 16px; background: rgba(59, 130, 246, 0.08); border: 1px solid rgba(59, 130, 246, 0.25); border-radius: var(--radius-md);">
        <div style="font-weight: 700; font-size: 0.95rem; margin-bottom: 8px; display: flex; align-items: center; gap: 8px;">
          <span>👑</span> 店舗オーナー設定 <small style="color: var(--text-secondary); font-weight: normal;">(Google連携)</small>
        </div>
        <p style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 12px; line-height: 1.5;">
          Googleアカウントをオーナーとして紐付けることで、パスコードを忘れた場合のリセットや管理権限を保持できます。
        </p>
        
        <div id="ownerLoggedOut">
          <button type="button" id="btnGoogleLoginRegister" class="btn-secondary" style="display: inline-flex; align-items: center; gap: 8px; font-weight: 700; background: #ffffff; color: #1f2937; border: 1px solid #d1d5db;">
            <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
            Googleアカウントでログイン
          </button>
        </div>

        <div id="ownerLoggedIn" style="display: none; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.05); padding: 8px 12px; border-radius: var(--radius-sm);">
          <div style="display: flex; align-items: center; gap: 10px;">
            <div style="font-size: 1.2rem;">👤</div>
            <div>
              <div id="ownerDisplayName" style="font-weight: 700; font-size: 0.9rem; color: var(--text-primary);"></div>
              <div id="ownerEmail" style="font-size: 0.8rem; color: var(--text-secondary);"></div>
            </div>
          </div>
          <button type="button" id="btnGoogleLogoutRegister" class="btn-sub-action" style="font-size: 0.8rem; padding: 4px 8px;">ログアウト</button>
        </div>
      </div>

      <form id="formRegister">
        <div class="form-group">
          <label class="form-label" for="shopName">メカニック店舗名 <small>(必須)</small></label>
          <input type="text" id="shopName" class="form-input" placeholder="例: ベニーガレージ" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="shopId">希望店舗ID (英数字) <small>(必須・URLに使用されます)</small></label>
          <input type="text" id="shopId" class="form-input" placeholder="例: benny-garage" pattern="[a-zA-Z0-9_-]+" title="半角英数字、ハイフン、アンダースコアが使用できます" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="passcode">管理用パスコード <small>(数字や英字)</small></label>
          <input type="password" id="passcode" class="form-input" placeholder="例: 1234" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="passcodeConfirm">管理用パスコード (確認用)</label>
          <input type="password" id="passcodeConfirm" class="form-input" placeholder="パスコードを再入力" required>
        </div>

        <div id="registerError" style="color: #ef4444; font-weight: 700; font-size: 0.9rem; margin-bottom: 16px; display: none;"></div>

        <div class="form-actions" style="justify-content: space-between; align-items: center;">
          <a href="index.html" class="btn-secondary">キャンセル</a>
          <button type="submit" id="btnSubmitRegister" class="btn-primary">🚀 店舗を開設する</button>
        </div>
      </form>
    </main>
  </div>

  <script src="firebase-config.js"></script>
  <script src="common.js"></script>
  <script src="register.js"></script>
</body>
</html>
