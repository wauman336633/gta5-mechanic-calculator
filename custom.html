<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カスタム料金計算 | メカニック計算ツール</title>
  <meta name="description" content="メカニック専用の自動車カスタム・性能チューニング見積計算ツール。外装や段階別パフォーマンスパーツ料金を一括計算。">
  <!-- Favicon & App Icons -->
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="icon" type="image/png" href="og-image.png">
  <link rel="apple-touch-icon" href="og-image.png">
  <!-- OGP / Social Meta Tags -->
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="MECHANIC CALCULATOR">
  <meta property="og:url" content="https://mechanic-calculator.web.app/custom.html">
  <meta property="og:title" content="カスタム料金計算 | メカニック計算ツール">
  <meta property="og:description" content="メカニック専用の自動車カスタム・性能チューニング見積計算ツール。外装や段階別パフォーマンスパーツ料金を一括計算。">
  <meta property="og:image" content="https://mechanic-calculator.web.app/og-image.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="カスタム料金計算 | メカニック計算ツール">
  <meta name="twitter:description" content="メカニック専用の自動車カスタム・性能チューニング見積計算ツール。外装や段階別パフォーマンスパーツ料金を一括計算。">
  <meta name="twitter:image" content="https://mechanic-calculator.web.app/og-image.png">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Zen+Kaku+Gothic+New:wght@400;600;700;800&display=swap" rel="stylesheet">
  <!-- Firebase Compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <div class="app-container">
    <!-- Header with Shop Brand & Hamburger Menu -->
    <header class="header">
      <div class="brand">
        <img src="logo.svg" alt="Mechanic Logo" class="brand-logo">
        <div class="brand-titles">
          <h1 class="brand-name">MECHANIC CALCULATOR</h1>
          <div class="brand-meta">
            <span class="brand-sub">カスタム計算モード</span>
            <div class="brand-shop-badge">
              <span>🏢</span>
              <span class="shop-name-display" id="currentShopName">読み込み中...</span>
            </div>
          </div>
        </div>
      </div>
      <div class="hamburger-menu-container">
        <button id="hamburgerBtn" class="hamburger-btn" aria-label="メニューを開く" aria-expanded="false">
          ☰
        </button>
        <div id="navMenuDropdown" class="menu-dropdown">
          <a href="#" id="menuCopyShopUrl" class="menu-item">
            <span class="menu-item-icon">🔗</span>
            <span>店舗URLを共有</span>
          </a>
          <a href="index.html" class="menu-item">
            <span class="menu-item-icon">🏠</span>
            <span>店舗切替</span>
          </a>
          <a href="settings.html" class="menu-item">
            <span class="menu-item-icon">⚙️</span>
            <span>設定</span>
          </a>
          <a href="#" id="menuFeedback" class="menu-item">
            <span class="menu-item-icon">💬</span>
            <span>不具合・ご要望</span>
          </a>
        </div>

      </div>
    </header>

    <!-- Sub Navigation Tabs (Header直下の右端揃え) -->
    <div class="sub-nav">
      <nav class="nav-tabs">
        <a href="repair.html" class="nav-tab">🔧 修理</a>
        <a href="custom.html" class="nav-tab active">🎨 カスタム</a>
        <a href="buyback.html" class="nav-tab">📦 買取</a>
      </nav>
    </div>

    <!-- Top Control Bar -->
    <section class="control-bar">
      <div class="control-title-group">
        <span class="mode-label">🎨 カスタム見積もり</span>
      </div>

      <button id="btnResetCustom" class="reset-btn" title="すべての選択を初期化">
        <span class="icon">🔄</span> 一括リセット
      </button>
    </section>

    <!-- Main Grid Content (Custom Page) -->
    <main class="main-grid" id="customMainGrid">
      <!-- Section 1: 性能カスタム (左) -->
      <div class="card category-card" id="cardCustomPerformance">
        <div class="card-header">
          <h2 class="card-title">⚡ 性能カスタム</h2>
        </div>
        <div class="card-body" id="customPerformanceContainer">
          <!-- JSで動的レンダリング -->
        </div>
      </div>

      <!-- Section 2: 外装カスタム -->
      <div class="card category-card" id="cardCustomExterior">
        <div class="card-header">
          <h2 class="card-title">🎨 外装カスタム</h2>
        </div>
        <div class="card-body" id="customExteriorContainer">
          <!-- JSで動的レンダリング -->
        </div>
      </div>

      <!-- Section 3: NOS -->
      <div class="card category-card" id="cardCustomRepairs">
        <div class="card-header">
          <h2 class="card-title">🚀 NOS</h2>
        </div>
        <div class="card-body" id="customRepairsContainer">
          <!-- JSで動的レンダリング -->
        </div>
      </div>

      <!-- Section 4: 販売品 -->
      <div class="card category-card" id="cardCustomItems">
        <div class="card-header">
          <h2 class="card-title">📦 販売品・アクセサリー</h2>
        </div>
        <div class="card-body" id="customItemsContainer">
          <!-- JSで動的レンダリング -->
        </div>
      </div>

      <!-- Section 6: 割引 ＆ 値引き設定 (カスタム側のみ) -->
      <div class="card category-card">
        <div class="card-header">
          <h2 class="card-title">🏷️ 割引・値引き設定</h2>
        </div>
        <div class="card-body">
          <div class="discount-preset-row">
            <button id="btnDisc3" class="discount-btn" data-discount="30">
              <span class="icon">🏷️</span> 3割引き <small>(30% OFF)</small>
            </button>
            <button id="btnDisc5" class="discount-btn" data-discount="50">
              <span class="icon">🏷️</span> 5割引き <small>(50% OFF)</small>
            </button>
            <button id="btnDisc7" class="discount-btn" data-discount="70">
              <span class="icon">🏷️</span> 7割引き <small>(70% OFF)</small>
            </button>
          </div>

          <div class="custom-discount-box">
            <div class="discount-input-group">
              <label for="customDiscountType">手動割引:</label>
              <select id="customDiscountType" class="discount-select">
                <option value="none">なし</option>
                <option value="percent">割合 (%)</option>
                <option value="fixed">定額 (円)</option>
              </select>
              <input type="number" id="customDiscountVal" value="0" min="0" class="discount-num-input" placeholder="0" disabled>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Bottom Sticky Summary & Action Bar -->
    <footer class="summary-bar">
      <div class="summary-inner">
        <!-- Display Totals with Inline Copy Buttons -->
        <div class="summary-amount-block">
          <div class="amount-sub">
            <span class="sub-label">小計:</span>
            <span id="subtotalDisplay">¥0</span>
            <span id="discountTagDisplay" class="discount-tag hidden">30%OFF適用中</span>
          </div>
          <div class="amounts-grid">
            <div class="amount-card-inline">
              <div class="amount-text-group">
                <span class="main-label">請求額</span>
                <span id="totalDisplay" class="total-price">¥0</span>
              </div>
              <button id="btnCopyNumber" class="btn-icon-only primary-copy" title="請求額の数値のみコピー">
                <span class="btn-icon">📋</span>
              </button>
            </div>

            <div class="amount-card-inline">
              <div class="amount-text-group">
                <span class="vault-label">金庫入金 (3割)</span>
                <span id="vaultDisplay" class="vault-price">¥0</span>
              </div>
              <button id="btnCopyVault" class="btn-icon-only vault-copy" title="金庫額の数値のみコピー">
                <span class="btn-icon">📋</span>
              </button>
            </div>
          </div>
        </div>

        <!-- Right Side Copy Action Buttons -->
        <div class="action-buttons-grid">
          <button id="btnCopyVaultSummary" class="btn-copy-sub" title="金庫額 + 作業内容サマリをコピー">
            <span class="btn-icon">📄</span>
            <span class="btn-sub-text">内容サマリ</span>
          </button>

          <button id="btnCopyOwnCar" class="btn-copy-sub highlight-owncar" title="自車 + 金庫額 + 作業内容サマリをコピー">
            <span class="btn-icon">🚗</span>
            <span class="btn-sub-text">内容サマリ＋自車</span>
          </button>
        </div>
      </div>
    </footer>

    <!-- Toast Notification -->
    <div id="toast" class="toast hidden">
      <span class="toast-icon">✅</span>
      <span id="toastMsg" class="toast-msg">コピーしました！</span>
    </div>
  </div>

  <script src="firebase-config.js"></script>
  <script src="common.js"></script>
  <script src="custom.js"></script>
</body>
</html>
